# Hero semantics overlay for the recommend ILP.
# Sources:
#   - https://kingshotmastery.com/guides/kingshot-widget-guide (widget type / march skill / priority)
#   - https://kingshotguide.net/guides/joiner-hero-mechanics-no-one-told-you-about/ (effect_op)
#   - https://kingshotdata.com/heroes/* (max skill values, best-effort)
# Join key = scraped HeroRecord.name. KingshotPro cache fills gen/troop/tiers.

