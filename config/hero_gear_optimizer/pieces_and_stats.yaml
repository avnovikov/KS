source: https://kingshotoptimizer.com/
source_version: 1.12.4
extracted_on: '2026-08-01'
notes:
- Copied from Kingshot Optimizer public web app JS for local planning.
- Default site optimizer optimizes ONE infantry+cavalry+archer set for Expedition.
- For early Arena/Conquest, prefer early_game_combat weights and do NOT ignore conquest
  imbuements (R+40/+80).
stat_formulas:
  epic: enhanced = base + (level/80)*(max-base); per_level = 0.0021
  mythic_or_gold: enhanced = base + (level/100)*(max-base); per_level = 0.0035
  blue: enhanced = base + (level/60)*(max-base); per_level = 0.0014 (OCR-calibrated)
  red_enhancement_gt_100: enhanced = 0.5 + (enhancement-100)*0.005
  mastery_bonus: final = enhanced * (1 + 0.1*mastery)
  ui_shows_base_mythic_at_0: 0.15
  scoring: rarity + enhancement_level + mastery_level only; OCR is sanity-check
