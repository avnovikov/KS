source: https://kingshotoptimizer.com/
source_version: 1.12.4
extracted_on: '2026-08-01'
notes:
- Copied from Kingshot Optimizer public web app JS for local planning.
- Default site optimizer optimizes ONE infantry+cavalry+archer set for Expedition.
- For early Arena/Conquest, prefer early_game_combat weights and do NOT ignore conquest
  imbuements (R+40/+80).
important_for_arena_conquest:
- Site optimizer values expedition milestones (120/160/200) and skips conquest ones
  (140/180).
- Conquest bonuses are hero-wide (Hero Health/Attack/Defense Up) — useful for Arena/Conquest
  even if expedition ROI is lower.
- 'Early-stage: prioritize mythic sets + mastery on combat-weighted pieces before
  red.'
f2p_recommendation: Stop at red 120 per piece (10 mithril + 5 mythic including ascension).
advanced_recommendation: Red 160 = 60 cumulative mithril + 15 mythic gear per piece.
