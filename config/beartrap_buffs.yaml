# Bear Trap host/joiner buff knobs for damage simulation.
# Score = ceil(10-round damage) from community formula (kingshotguides).
#
# SkillMod v2 (2026-08-07):
#   skillmod = research × ∏(1 + DamageUp[op]/100) × … / DefenseUp …
# Host DamageUp comes from the lineup catalog; assumed_joiners model the
# top-4 joiner first skills (default 2× lethality + 2× attack at 25%).

trap_level: 5                 # +5% attack per level → +25% at L5
host_attack_pct: 0.0          # extra flat attack from research/gear (fraction)
research_skillmod: 1.0        # city/research multiplier (tune vs a known rally)

# Top-4 assumed joiner first skills: mix ops so they multiply (2.25×).
assumed_joiners:
  - {effect_op: 101, pct: 25}   # Lethality DamageUp (Chenko-class)
  - {effect_op: 101, pct: 25}
  - {effect_op: 102, pct: 25}   # Attack DamageUp (Amane-class)
  - {effect_op: 102, pct: 25}

calibration_score: 180000
calibration_march: 80245
