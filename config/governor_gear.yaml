# Governor Gear ladder + slot map.
# Sources (community tables; not official API dumps):
#   - https://kingshotoptimizer.com/governor-gear/references/
#   - https://kingshotwiki.com/governor-gear/governor-gear/
#   - https://kingshotdata.com/database/governor-gear/
# extracted_on: 2026-08-09
#
# Set-bonus rule (documented for implementers):
#   Count pieces that share the same `tier` key (stars may differ).
#   If >= 3 pieces share a tier → apply that tier's set_defense_pct (3pc).
#   If >= 6 pieces share a tier → also apply that tier's set_attack_pct (6pc).
#   If multiple tiers qualify, prefer the higher ladder rank.

slots:
  hood:
    display_name: Hood
    troop: cavalry
    pair: necklace
  necklace:
    display_name: Necklace
    troop: cavalry
    pair: hood
  cloak:
    display_name: Cloak
    troop: infantry
    pair: breeches
  breeches:
    display_name: Breeches
    troop: infantry
    pair: cloak
  ring:
    display_name: Ring
    troop: archers
    pair: staff
  staff:
    display_name: Staff
    troop: archers
    pair: ring

# Ordered ladder: each step is one Upgrade click from the previous.
# attack_pct == defense_pct per piece (game tables).
