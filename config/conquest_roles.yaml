# Conquest placement multipliers (5 heroes, 2F+3B).
# Hero roles/values from hero_catalog.yaml via load_combat_roles.
slots:
  front: [F1, F2]
  back: [B1, B2, B3]
  carry_slot: B2
placement:
  infantry_front: 1.30
  cavalry_front: 1.05
  archers_front: 0.50
  infantry_back: 0.85
  cavalry_back: 1.10
  archers_back: 1.15
  carry_slot_bonus: 1.10
  front_tank_bonus: 1.15
# Front-collapse degradation vs self-play foes (our heroes/gear/power).
# See docs/superpowers/specs/2026-08-03-arena-front-survival-opponent-models-design.md
survival:
  enabled: true
  primary_foe: naive_max_power
  foes:
  - naive_max_power
  - troop_balanced_naive
  - heuristic_foe
  lambda_tau: 5.0
  power_sanitize_max: 2000000
  power_sanitize_median_factor: 20
