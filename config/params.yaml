dry_run: true
adb:
  serial: null
account:
  march_load: 1000000
  gather_rate_per_sec:
    bread: 200.0
    wood: 200.0
    stone: 40.0
    iron: 10.0
scoring:
  candidate_limit: 5
resources:
  preference_order: [bread, wood, stone, iron]
executor:
  max_taps_per_proposal: 20
  tap_delay_ms: 250
  tap_jitter_ms: 50
vision:
  match_threshold: 0.85

# Ordered taps to navigate to the gather-search screen.
# Leave empty ({}) until you have measured coordinates on your device.
# Example (BlueStacks 1080x1920):
#   taps:
#     - {x: 54,  y: 1820}   # world-map button
#     - {x: 900, y: 100}    # search / find-resource button
#
# gather_actions: tap sequence executed after the best tile is confirmed
#   (select tile → tap Gather button → tap Confirm/Send march).
# Example (BlueStacks 1080x1920):
#   gather_actions:
#     - {x: 540, y: 960}    # tap tile to open tile panel
#     - {x: 540, y: 1600}   # Gather button
#     - {x: 700, y: 1750}   # Confirm / Send march
navigation: {}

# OCR crop boxes for reading resource amount and march time from the
# gather-candidate list.  Each entry maps to one visible row on screen.
# Leave empty ({}) until you have measured coordinates on your device.
# Example:
#   candidates:
#     - resource: bread
#       amount:     {x: 120, y: 400, w: 200, h: 45}
#       march_time: {x: 430, y: 400, w: 160, h: 45}
ocr_regions: {}
