# Arena generic-offense role hints (Conquest / Battle skills).
# Sources: kingshotmastery Arena guide, grindnstrat, kingshotguides early Arena,
# kingshot.fandom Gen1 lineups. Used only for Arena ILP — not marches.

slots:
  front: [F1, F2]
  back: [B1, B2, B3]
  # B2 = middle back (safest carry per early-game guides)
  carry_slot: B2

# Multipliers applied to hero score when placed in a slot family.
placement:
  infantry_front: 1.25
  cavalry_front: 1.05
  # Keys must match normalize_troop(): infantry|cavalry|archers
  archers_front: 0.55
  infantry_back: 0.85
  cavalry_back: 1.10
  archers_back: 1.15
  carry_slot_bonus: 1.12
  front_tank_bonus: 1.10

