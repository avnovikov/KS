# Arena placement multipliers only.
# Hero arena_role / arena_value / arena_tags live in config/hero_catalog.yaml
# (single source of truth). Loaded via load_arena_roles(..., catalog=...).
#
# Sources: kingshotmastery Arena guide, grindnstrat, kingshotguides early Arena.
#
slots:
  front:
  - F1
  - F2
  back:
  - B1
  - B2
  - B3
  carry_slot: B2
placement:
  infantry_front: 1.25
  cavalry_front: 1.05
  archers_front: 0.55
  infantry_back: 0.85
  cavalry_back: 1.1
  archers_back: 1.15
  carry_slot_bonus: 1.12
  front_tank_bonus: 1.1
# Offline defense: keep tanks up front, heal on B1, slightly prefer sustain.
defense_placement:
  infantry_front: 1.35
  cavalry_front: 1.1
  archers_front: 0.45
  infantry_back: 0.9
  cavalry_back: 1.05
  archers_back: 1.1
  carry_slot_bonus: 1.08
  front_tank_bonus: 1.2
  heal_slot: B1
  heal_slot_bonus: 1.28
  tank_tag_bonus: 1.15
  heal_tag_bonus: 1.25
  team_def_tag_bonus: 1.1
  glass_dps_penalty: 0.92
# Front-collapse degradation vs self-play foes (our heroes/gear/power).
# See docs/superpowers/specs/2026-08-03-arena-front-survival-opponent-models-design.md
survival:
  enabled: true
  primary_foe: naive_max_power
  foes:
  - naive_max_power
  - troop_balanced_naive
  - heuristic_foe
  lambda_tau: 5.0
  power_sanitize_max: 2000000
  power_sanitize_median_factor: 20
