# Kingshot troop-tier baseline data
#
# Source: kingshotoptimizer.com Troops Calculator
#   (assets/useTroopCalculatorPresets-*.js), cross-checked against
#   kingshotcalculator.com troop-training-and-promotion-calculator
#   (same time/power/points table). Scraped 2026-07-24.
#
# Purpose: DEFAULT reference for ks/calc troop training — not live truth.
#          Recalibrate from in-game timers when they diverge.
#
# Timing formula used by source (and recommended here):
#   effective_seconds = training_time_seconds / (1 + training_speed_pct / 100)
# Promotion / train-from-stock:
#   delta_field = target.field - current.field  (time, power, points, costs)
#
# Optional additive speed modifiers (source UI; fold into training_speed_pct
# or apply separately before the formula):
#   Chief Minister: +10%  (+15% with High King)
#   Noble Advisor:   +50%  (+75% with High King)
#   Mobilize / Kingdom Skill: +30%
#   KvK Bonus: +25%
#
# Event point keys: sg (State Greatness), kvk, op, ab (Alliance Brawl), hog (HoG).
# HoG values are much larger than kingshotguide.com — verify in-game before trusting scores.
#
# Cost troop types: infantry | cavalry | archer (source uses "archery" → mapped to archer).

meta:
  source: "kingshotoptimizer.com"
  scraped: "2026-07-24"
  time_unit: seconds_per_troop
  speed_formula: "base / (1 + training_speed_pct / 100)"

