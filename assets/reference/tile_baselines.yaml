# Kingshot resource-tile baseline data
#
# Source: kingshot.fun community table (as of 2026-07)
# Purpose: DEFAULT reference only — not live truth.
#          Use these values to sanity-check OCR reads and as fallback
#          when a tile's info popup cannot be parsed.
#
# Schema per level:
#   bread:   total resource units on a level-N bread tile (normal)
#   wood:    total resource units on a level-N wood tile  (normal)
#   stone:   total resource units on a level-N stone tile (normal)
#   iron:    total resource units on a level-N iron tile  (normal)
#   gather_minutes:  typical normal gather time in minutes (single-troop full load)
#
# All amounts are approximate community averages; exact values vary by server age.

tile_baselines:
  - level: 1
    bread: 5_000
    wood: 5_000
    stone: 5_000
    iron: 5_000
    gather_minutes: 1

