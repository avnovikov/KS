# Lessons for a future reusable OCR module (see FINDINGS.md § Lessons learned)
lessons_learned:
  pipeline: [mask_ui, crop_map, viewport_ocr, label_ocr_on_cropped, project_world, dedupe, emit_blockers]
  primary_ocr_surface: cropped_shots  # not raw UI; panorama is QA only
  mask: fractional_rects_from_user_fixed_frame
  viewport: required_per_shot_with_manual_fallback
  zoom: must_be_constant_within_batch
  axes_deg: "not 45; ~±35 on this zoom (world X/Y on screen)"
  mat: bootstrap_from_stitch_x_viewport_then_refine_with_popup_anchors
  mat_caution: global_fit_can_have_large_residual_refine_locally
  grid_phase: do_not_block_ocr_on_perfect_border_lock
  footprints_from_kind: {city: [2, 2], mill_banner: [1, 1], trap: [3, 3], hq: TBD}
  dedupe: inventory_match_graph_plus_operator_confirm
  never_auto_merge: [alliance_banners]
  skip_classes: [animals, mobs, clearable_small_farms, ui_chrome, march_arrows]
  stitch: orb_translation_graph_beats_scans_alone
  stitch_pairs: landmark_confirmed_not_viewport_only
  capture: same_zoom_overlap_30pct_popup_for_critical_xy
  module_units: [mask_crop, viewport_ocr, label_ocr, world_project, dedupe, footprint, emit]
  findings_doc: assets/reference/bear-trap/FINDINGS.md
