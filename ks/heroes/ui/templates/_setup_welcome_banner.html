{# First-visit welcome — dismissible; does not block inventory. #}
<div class="setup-welcome banner-warn" id="setup-welcome" role="region" aria-label="Setup guide" hidden>
  <p class="setup-welcome-text">
    New here? Walk through setup in order: Heroes → Gear → Troops → Governor charms.
  </p>
  <div class="setup-welcome-actions">
    <button type="button" class="btn primary" id="setup-welcome-start">Start setup</button>
    <button type="button" class="btn ghost" id="setup-welcome-dismiss">Continue without setup</button>
  </div>
</div>
