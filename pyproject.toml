[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ks"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0",
  "adbutils>=2.8",
  "opencv-python-headless>=4.8",
  "numpy>=1.26",
  "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ks = "ks.cli:main"

[tool.setuptools.packages.find]
include = ["ks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
