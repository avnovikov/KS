[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ks"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0",
  "adbutils>=2.8",
  "opencv-python-headless>=4.8",
  "numpy>=1.26",
  "pytesseract>=0.3.10",
  "discord.py>=2.3",
]

[project.optional-dependencies]
stitch = ["stitching>=0.6.1", "opencv-contrib-python-headless>=4.8,<4.12"]
dev = ["pytest>=8.0"]

[project.scripts]
ks = "ks.cli:main"
ks-discord = "ks.discord.bot:main"
ks-cartograph = "ks.cartograph.cli:main"

[tool.setuptools.packages.find]
include = ["ks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
