[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ks"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0",
  "adbutils>=2.8",
  "opencv-python-headless>=4.8",
  "numpy>=1.26",
  "pytesseract>=0.3.10",
  "discord.py>=2.3",
  "h3>=4.0",
  "pulp>=2.8",
]

[project.optional-dependencies]
stitch = ["stitching>=0.6.1", "opencv-contrib-python-headless>=4.8,<4.12"]
ui = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "jinja2>=3.1", "httpx>=0.27", "itsdangerous>=2.1"]
dev = ["pytest>=8.0", "httpx>=0.27"]
alliance-ocr-bench = [
  "easyocr>=1.7",
  "paddleocr>=2.7",
  "rapidocr-onnxruntime>=1.3",
  "python-doctr>=0.8",
]

[project.scripts]
ks = "ks.cli:main"
ks-discord = "ks.discord.bot:main"
ks-cartograph = "ks.cartograph.cli:main"
ks-heroes = "ks.heroes.cli:main"

[tool.setuptools.packages.find]
include = ["ks*"]

[tool.setuptools.package-data]
"ks.heroes.ui" = ["templates/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
